# Baut die App für den iPhone-Simulator, prüft den Kern unter macOS (CryptoKit) und legt
# Bildschirmfotos aus dem Simulator ab.
# Nur von Hand starten; es gibt keine automatischen Auslöser.
name: iOS bauen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Kern testen
        run: swift test
      - name: Projekt erzeugen
        run: xcodegen generate --spec App/project.yml
      - name: App für den Simulator bauen
        run: |
          # Bei einem Fehlschlag die Meldungen des Übersetzers zeigen (sie stehen weit oben)
          if ! xcodebuild -project App/HUBIplan.xcodeproj -scheme HUBIplan \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > bau.log 2>&1; then
            grep -E "error:" bau.log | sort -u | head -n 40
            tail -n 15 bau.log
            exit 1
          fi
          tail -n 5 bau.log
      - name: Im Simulator starten und Bildschirmfotos machen
        run: |
          set -euo pipefail
          mkdir -p bilder
          GERAET=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+ \(' | sed 's/ ($//')
          echo "Simulator: $GERAET"
          xcrun simctl boot "$GERAET"
          xcrun simctl bootstatus "$GERAET" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/HUBIplan.app
          foto() {  # Name, Sprache, weitere Startargumente
            xcrun simctl terminate booted de.hubiplan.app || true
            xcrun simctl launch booted de.hubiplan.app -AppleLanguages "($2)" "${@:3}"
            sleep 6
            xcrun simctl io booted screenshot "bilder/$1-$2.png"
          }
          for SPRACHE in de en; do
            foto verbinden "$SPRACHE"
            foto termine "$SPRACHE" -demo 1 -reiter termine
            foto neues "$SPRACHE" -demo 1 -reiter mitteilungen
            foto aufgaben "$SPRACHE" -demo 1 -reiter aufgaben
            foto helfer "$SPRACHE" -demo 1 -reiter aufgaben -abschnitt helfer
            foto noten "$SPRACHE" -demo 1 -reiter noten
            foto mappe "$SPRACHE" -demo 1 -reiter noten -abschnitt mappe
            foto pult "$SPRACHE" -demo 1 -reiter noten -abschnitt pult
            foto ausweis "$SPRACHE" -demo 1 -reiter ausweis
            foto rechnungen "$SPRACHE" -demo 1 -reiter ausweis -abschnitt rechnungen
            foto versammlungen "$SPRACHE" -demo 1 -reiter ausweis -abschnitt versammlungen
            foto dokumente "$SPRACHE" -demo 1 -reiter ausweis -abschnitt dokumente
            foto verwaltung "$SPRACHE" -demo 1 -reiter ausweis -abschnitt verwaltung
            foto freischalten "$SPRACHE" -demo 1 -reiter ausweis -abschnitt freischalten
            foto offen "$SPRACHE" -demo 1 -reiter ausweis -abschnitt offen
            foto meldungen "$SPRACHE" -demo 1 -reiter ausweis -abschnitt meldungen
            foto ausweispruefung "$SPRACHE" -demo 1 -reiter ausweis -abschnitt ausweispruefung
            foto stammdaten "$SPRACHE" -demo 1 -reiter ausweis -abschnitt stammdaten
            foto anlaesse "$SPRACHE" -demo 1 -reiter ausweis -abschnitt anlaesse
            foto vtermine "$SPRACHE" -demo 1 -reiter ausweis -abschnitt vtermine
            foto vtermin "$SPRACHE" -demo 1 -reiter ausweis -abschnitt vtermin
            foto neuertermin "$SPRACHE" -demo 1 -reiter ausweis -abschnitt neuertermin
            foto kasse "$SPRACHE" -demo 1 -reiter ausweis -abschnitt kasse
            foto buchung "$SPRACHE" -demo 1 -reiter ausweis -abschnitt buchung
            foto neuebuchung "$SPRACHE" -demo 1 -reiter ausweis -abschnitt neuebuchung
            foto mitglieder "$SPRACHE" -demo 1 -reiter ausweis -abschnitt mitglieder
            foto mitglied "$SPRACHE" -demo 1 -reiter ausweis -abschnitt mitglied
            foto konto "$SPRACHE" -demo 1 -reiter konto
            foto kalender "$SPRACHE" -demo 1 -reiter konto -abschnitt kalender
          done
          xcrun simctl shutdown booted
      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: bilder/
          retention-days: 7
