# Baut die App für den iPhone-Simulator, prüft den Kern unter macOS (CryptoKit) und legt
# Bildschirmfotos aus dem Simulator ab.
# Nur von Hand starten; es gibt keine automatischen Auslöser.
name: iOS bauen

on:
  workflow_dispatch:
    inputs:
      vorschau:
        description: Kleines Vorschaubild (Name ohne Endung, z. B. termine-de) ins Protokoll schreiben
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bauen:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Kern testen
        run: swift test
      - name: Projekt erzeugen
        run: xcodegen generate --spec App/project.yml
      - name: App für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild -project App/HUBIplan.xcodeproj -scheme HUBIplan \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Im Simulator starten und Bildschirmfotos machen
        run: |
          set -euo pipefail
          mkdir -p bilder
          GERAET=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+ \(' | sed 's/ ($//')
          echo "Simulator: $GERAET"
          xcrun simctl boot "$GERAET"
          xcrun simctl bootstatus "$GERAET" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/HUBIplan.app
          foto() {  # Name, Sprache, weitere Startargumente
            xcrun simctl terminate booted de.hubiplan.app || true
            xcrun simctl launch booted de.hubiplan.app -AppleLanguages "($2)" "${@:3}"
            sleep 6
            xcrun simctl io booted screenshot "bilder/$1-$2.png"
          }
          for SPRACHE in de en; do
            foto verbinden "$SPRACHE"
            foto termine "$SPRACHE" -demo 1 -reiter termine
            foto neues "$SPRACHE" -demo 1 -reiter mitteilungen
            foto konto "$SPRACHE" -demo 1 -reiter konto
          done
          xcrun simctl shutdown booted
      - name: Vorschaubild ins Protokoll
        if: ${{ inputs.vorschau != '' }}
        run: |
          sips -Z 520 -s format jpeg -s formatOptions 35 "bilder/${{ inputs.vorschau }}.png" --out vorschau.jpg > /dev/null
          echo "VORSCHAU-ANFANG"
          base64 -i vorschau.jpg | tr -d '\n' | fold -w 4000
          echo
          echo "VORSCHAU-ENDE"
      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: bilder/
          retention-days: 7
