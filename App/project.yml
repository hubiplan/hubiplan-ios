# Xcode-Projekt der App; wird mit XcodeGen erzeugt (`xcodegen generate --spec App/project.yml`),
# nicht eingecheckt.
name: HUBIplan
options:
  bundleIdPrefix: de.hubiplan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  HubiplanKern:
    path: ..
targets:
  HUBIplan:
    type: application
    platform: iOS
    sources:
      - HUBIplan
    dependencies:
      - package: HubiplanKern
    info:
      path: HUBIplan/Info.plist
      properties:
        CFBundleDisplayName: HUBIplan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Die Kamera liest den QR-Code, mit dem du die App mit deinem Verein verbindest, und in der Verwaltung den QR-Code eines Mitgliedsausweises; außerdem fotografierst du damit Belege und Ergebnisse.
        NSCalendarsFullAccessUsageDescription: Die App trägt die Termine deines Vereins in einen eigenen Kalender ein und hält sie dort aktuell.
        NSFaceIDUsageDescription: Mit Face ID öffnest du die Verwaltung deines Vereins in der App.
        CFBundleURLTypes:
          - CFBundleURLName: de.hubiplan.app.verbinden
            CFBundleURLSchemes: [hubiplan]
        # Termin aus Mail oder Kalender (.ics) „Öffnen in HUBIplan“: füllt in der Verwaltung
        # „Neuer Termin“ vor (hubiplan konzepte/termine-aus-dem-mailprogramm.md, W4)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kalendertermin
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.ical.ics, public.calendar-event]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hubiplan.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
